name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: skytravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npm --workspace server run prisma:generate

      - name: Run database migrations
        run: npm --workspace server exec -- prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/skytravel_test

      - name: Run server tests
        run: |
          set -o pipefail
          npm --workspace server run test 2>&1 | tee /tmp/server-test.log
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/skytravel_test
          SESSION_SECRET: test-secret-for-ci
          ADMIN_LOGIN: admin@test.com
          ADMIN_PASSWORD: testpassword123
          DISABLE_RATE_LIMIT: "true"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -120 /tmp/server-test.log > /tmp/fail.txt || echo "no log" > /tmp/fail.txt
          gh issue create \
            --title "test: server tests failed @ ${GITHUB_SHA::7}" \
            --body-file /tmp/fail.txt \
            --repo "$GITHUB_REPOSITORY" || true

      - name: Run client tests
        run: npm --workspace client run test
