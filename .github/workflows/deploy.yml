name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Secret sanity check
        run: |
          K="${{ secrets.SSH_PRIVATE_KEY }}"
          LEN=${#K}
          BEGIN=$(printf '%s' "$K" | grep -c 'BEGIN OPENSSH PRIVATE KEY' || true)
          END=$(printf '%s' "$K" | grep -c 'END OPENSSH PRIVATE KEY' || true)
          CR=$(printf '%s' "$K" | grep -c $'\r' || true)
          LIT=$(printf '%s' "$K" | grep -c '\\\\n' || true)
          {
            echo "len=$LEN"
            echo "begin_ok=$BEGIN"
            echo "end_ok=$END"
            echo "has_cr=$CR"
            echo "literal_slash_n=$LIT"
          } > /tmp/keymeta.txt

          printf '%s' "$K" > /tmp/probe_key
          chmod 600 /tmp/probe_key
          PARSE=$(ssh-keygen -y -P '' -f /tmp/probe_key 2>&1 | head -1 | cut -c1-60)
          FPR=$(ssh-keygen -lf /tmp/probe_key 2>/dev/null | cut -d' ' -f2)
          {
            echo "parse_first_line=$PARSE"
            echo "fingerprint=${FPR:-PARSE_FAILED}"
          } >> /tmp/keymeta.txt
          rm -f /tmp/probe_key

          PORT_V="${{ secrets.SSH_PORT }}"
          USER_V="${{ secrets.SSH_USER }}"
          {
            echo "ssh_port_set=$([ -n "$PORT_V" ] && echo yes || echo no) len=${#PORT_V}"
            echo "ssh_user_set=$([ -n "$USER_V" ] && echo yes || echo no) len=${#USER_V}"
          } >> /tmp/keymeta.txt
          cat /tmp/keymeta.txt

      - name: Deploy via SSH
        if: success()
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA_SHORT: ${{ github.sha }}
        with:
          host: 167.233.47.103
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          envs: GH_TOKEN,GITHUB_REPOSITORY,SHA_SHORT
          script: |
            LOG=/tmp/deploy-$$.log
            RC=0
            {
              set -euo pipefail

              REMOTE_PATH="/home/ubuntu/skytravel"
              cd "$REMOTE_PATH"

              echo "▸ Pulling latest code …"
              git fetch origin main
              git reset --hard origin/main

              echo "▸ Stopping running services …"
              pm2 stop ecosystem.config.cjs 2>/dev/null || true
              # Kill any orphaned app processes so they cannot hold DB locks.
              # [x] bracket trick prevents pkill from matching this script's own argv.
              pkill -9 -f "node dist/[i]ndex.js" 2>/dev/null || true
              pkill -9 -f "vite previe[w]" 2>/dev/null || true
              sleep 2

              echo "▸ Installing dependencies …"
              npm ci --legacy-peer-deps

              echo "▸ Preparing bots env …"
              DB_URL=$(grep ^DATABASE_URL server/.env | head -1 | sed 's/^DATABASE_URL=//;s/^"//;s/"$//')
              if [ ! -f bots/.env ]; then
                cp bots/.env.example bots/.env
                sed -i "s|DATABASE_URL=.*|DATABASE_URL=\"${DB_URL}\"|" bots/.env
                echo "  ⚠ bots/.env created from template — fill TELEGRAM_BOT_TOKEN manually"
              else
                # Ensure DATABASE_URL is correct even if file exists
                if grep -q "^DATABASE_URL=" bots/.env; then
                  sed -i "s|DATABASE_URL=.*|DATABASE_URL=\"${DB_URL}\"|" bots/.env
                else
                  echo "DATABASE_URL=\"${DB_URL}\"" >> bots/.env
                fi
              fi

              echo "▸ Building server …"
              cd server
              npx prisma generate
              NODE_OPTIONS="--max-old-space-size=512" npx tsc -p tsconfig.json
              npx tsc-alias -p tsconfig.json --resolve-full-paths -fe .js
              cd ..

              echo "▸ Running database migrations …"
              (cd server && npx prisma migrate deploy)

              echo "▸ Building bots …"
              (cd bots && npx prisma generate && npx tsc -p tsconfig.json && npx tsc-alias -p tsconfig.json --resolve-full-paths -fe .js)

              echo "▸ Building client …"
              npm --workspace client run build

              echo "▸ Starting PM2 apps …"
              pm2 start ecosystem.config.cjs --env production
              pm2 save

              echo "▸ Refreshing Alexandria feed …"
              mkdir -p /home/ubuntu/logs
              cd server
              # Fire-and-forget: app also self-refreshes every 25 min
              nohup npx tsx scripts/refresh-alexandria.ts \
                > /home/ubuntu/logs/alexandria-refresh.log 2>&1 &
              cd ..
              echo "✅ Deploy complete!"
            } >> "$LOG" 2>&1 || RC=$?

            cat "$LOG"
            exit $RC

      - name: Report deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Deploy via SSH failed on runner."
            echo ""
            echo '```'
            cat /tmp/keymeta.txt 2>/dev/null || echo "(no keymeta)"
            echo '```'
          } > /tmp/body.txt
          gh issue create \
            --title "deploy: failed @ ${GITHUB_SHA::7}" \
            --body-file /tmp/body.txt \
            --repo "$GITHUB_REPOSITORY" || true
