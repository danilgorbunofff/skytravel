name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Deploy via SSH
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: 167.233.47.103
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            REMOTE_PATH="${{ secrets.REMOTE_PROJECT_PATH || '/home/ubuntu/skytravel' }}"
            cd "$REMOTE_PATH"

            echo "▸ Pulling latest code …"
            git fetch origin main
            git reset --hard origin/main

            echo "▸ Stopping running services …"
            pm2 stop ecosystem.config.cjs 2>/dev/null || true

            echo "▸ Installing dependencies …"
            npm ci --legacy-peer-deps

            echo "▸ Building server …"
            cd server
            npx prisma generate
            NODE_OPTIONS="--max-old-space-size=512" npx tsc -p tsconfig.json
            cd ..

            echo "▸ Running database migrations …"
            (cd server && npx prisma migrate deploy)

            echo "▸ Building client …"
            npm --workspace client run build

            echo "▸ Starting PM2 apps …"
            pm2 start ecosystem.config.cjs --env production
            pm2 save

            echo "▸ Refreshing Alexandria feed …"
            cd server
            npx tsx scripts/refresh-alexandria.ts || echo "  ⚠ Alexandria refresh failed (non-critical)"

            echo "✅ Deploy complete!"
