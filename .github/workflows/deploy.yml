name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            REMOTE_PATH="${{ secrets.REMOTE_PROJECT_PATH || '/home/ubuntu/skytravel' }}"
            cd "$REMOTE_PATH"

            echo "▸ Pulling latest code …"
            git fetch origin main
            git reset --hard origin/main

            echo "▸ Stopping running services …"
            pm2 stop ecosystem.config.cjs 2>/dev/null || true

            echo "▸ Installing dependencies …"
            npm ci --legacy-peer-deps

            echo "▸ Ensuring workspace symlinks …"
            for pkg in react react-dom react-router-dom class-variance-authority clsx tailwind-merge lucide-react zustand; do
              if [ ! -e "client/node_modules/$pkg" ]; then
                ln -s "../../node_modules/$pkg" "client/node_modules/$pkg"
              fi
            done

            echo "▸ Building server …"
            cd server
            npx prisma generate
            NODE_OPTIONS="--max-old-space-size=512" npx tsc -p tsconfig.json
            cd ..

            echo "▸ Running database migrations …"
            (cd server && npx prisma migrate deploy)

            echo "▸ Building client …"
            npm --workspace client run build

            echo "▸ Starting PM2 apps …"
            pm2 start ecosystem.config.cjs --env production
            pm2 save

            echo "▸ Refreshing Alexandria feed …"
            cd server
            npx tsx scripts/refresh-alexandria.ts || echo "  ⚠ Alexandria refresh failed (non-critical)"

            echo "✅ Deploy complete!"
